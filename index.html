<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vera AI Chatbot</title>
  <style>
    :root {
      --bg: #0d1117;
      --card: #161b22;
      --bubble-bot: #21262d;
      --bubble-user: #238636;
      --text: #f0f6fc;
      --muted: #8b949e;
      --border: #30363d;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    body { background: var(--bg); color: var(--text); display: flex; justify-content: center; height: 100vh; }
    .chat-container { width: 100%; max-width: 650px; display: flex; flex-direction: column; border-left: 1px solid var(--border); border-right: 1px solid var(--border); background: var(--card); }
    .header { padding: 16px; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 12px; }
    .avatar { font-size: 26px; }
    .title h1 { font-size: 18px; }
    .title p { font-size: 12px; color: var(--muted); }
    .messages { flex: 1; padding: 16px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; }
    .msg { max-width: 80%; padding: 10px 14px; border-radius: 14px; line-height: 1.4; font-size: 14px; word-break: break-word; }
    .msg.bot { align-self: flex-start; background: var(--bubble-bot); border: 1px solid var(--border); }
    .msg.user { align-self: flex-end; background: var(--bubble-user); }
    .input-box { display: flex; padding: 12px; gap: 8px; border-top: 1px solid var(--border); background: var(--bg); }
    input { flex: 1; background: var(--card); border: 1px solid var(--border); color: var(--text); padding: 10px 14px; border-radius: 8px; outline: none; }
    button { background: #238636; color: white; border: none; padding: 10px 18px; border-radius: 8px; cursor: pointer; font-weight: 600; }
    button:hover { background: #2ea043; }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
  </style>
</head>
<body>
  <div class="chat-container">
    <div class="header">
      <div class="avatar">🤖</div>
      <div class="title">
        <h1>Vera AI Chatbot</h1>
        <p>Live on Render • Powered by your backend</p>
      </div>
    </div>
    <div class="messages" id="messages">
      <div class="msg bot">Hello! I am Vera. What can I help you with today?</div>
    </div>
    <form class="input-box" id="chat-form">
      <input type="text" id="user-input" placeholder="Type a message..." autocomplete="off" />
      <button type="submit" id="send-btn">Send</button>
    </form>
  </div>

  <script>
    const form = document.getElementById('chat-form');
    const input = document.getElementById('user-input');
    const messages = document.getElementById('messages');
    const sendBtn = document.getElementById('send-btn');

    function appendMessage(text, role) {
      const msg = document.createElement('div');
      msg.className = `msg ${role}`;
      msg.textContent = text;
      messages.appendChild(msg);
      messages.scrollTop = messages.scrollHeight;
      return msg;
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const text = input.value.trim();
      if (!text) return;
      input.value = '';

      appendMessage(text, 'user');
      const typing = appendMessage('Typing...', 'bot');
      sendBtn.disabled = true;

      try {
        const res = await fetch('/api/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ message: text })
        });
        const data = await res.json();
        typing.textContent = data.reply || "Sorry, I couldn't process that.";
      } catch (err) {
        typing.textContent = "Error connecting to server.";
      } finally {
        sendBtn.disabled = false;
        messages.scrollTop = messages.scrollHeight;
      }
    });
  </script>
</body>
</html>
